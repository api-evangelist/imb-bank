name: IMB Bank
kind: company
description: IMB Bank (IMB Ltd, ABN 92 087 651 974) is a member-owned Australian mutual
  bank founded in 1880 as the Illawarra Mutual Building Society in Wollongong, New
  South Wales. It is an authorised deposit-taking institution (ADI) regulated by APRA
  and ASIC, offering home loans, personal and business banking, deposits, cards and
  insurance to members across NSW, Victoria and the ACT. As a mutual, IMB is owned
  by its members rather than external shareholders. Under Australia's Consumer Data
  Right (CDR / Open Banking), IMB operates as a data holder and exposes a public,
  unauthenticated Product Reference Data (PRD) API conforming to the Consumer Data
  Standards, alongside an accredited data recipient (ADR) consent flow for sharing
  member banking data. IMB also runs a public developer sandbox and marketplace at
  developer.openbanking.imb.com.au.
