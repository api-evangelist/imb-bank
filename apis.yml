- aid: imb-bank:imb-bank-cdr-product-reference-data-api
  name: IMB Bank CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking Products
  - Consumer Data Standards
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.imb.com.au/openbanking
  baseURL: https://openbank.openbanking.imb.com.au/cds-au/v1/banking/products
  properties:
  - url: https://www.imb.com.au/openbanking
    type: Documentation
  - url: https://developer.openbanking.imb.com.au/public/apis
    type: APIReference
  - url: openapi/imb-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right (CDR) Product Reference
    Data API exposing IMB Bank's retail banking products (home loans, deposits, cards
    and more) under the Consumer Data Standards path /cds-au/v1/banking/products.
    Confirmed live returning HTTP 200 with x-v 4 (HTTP 406 on an unsupported x-v),
    returning a data.products array; supports endpoint versions x-v 4 and 5. Covers
    the GET /banking/products list and GET /banking/products/{productId} detail
    operations. This is the only publicly callable, unauthenticated slice of IMB's
    CDR surface.
- aid: imb-bank:imb-bank-cdr-accounts-balances-api
  name: IMB Bank CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Banking Accounts
  - Account Balances
  - Consumer Data Standards
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.imb.com.au/openbanking
  baseURL: https://openbank.openbanking.imb.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.imb.com.au/openbanking
    type: Documentation
  - url: https://developer.openbanking.imb.com.au/public/apis
    type: APIReference
  - url: openapi/imb-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right (CDR) Accounts and Balances
    API. Once an IMB member consents through an Accredited Data Recipient (ADR) under
    the CDR consent model, this surface exposes GET /banking/accounts (list accounts),
    GET /banking/accounts/{accountId} (account detail), GET /banking/accounts/balances
    (bulk balances), and GET /banking/accounts/{accountId}/balance (single balance).
    These endpoints require an authorized CDR access token over the mutual-TLS data
    holder channel and are NOT publicly callable. IMB is legally required to implement
    this standardized surface as an accredited CDR data holder; the schema is the
    shared DSB Consumer Data Standards CDR Banking API v1.36.0.
