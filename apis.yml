  - url: https://developer.openbanking.imb.com.au/public/apis
    type: APIReference
  - url: openapi/imb-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right (CDR) Transactions API exposing
    GET /banking/accounts/{accountId}/transactions (transactions for an account) and
    GET /banking/accounts/{accountId}/transactions/{transactionId} (transaction
    detail). Access requires an IMB member's CDR consent granted to an Accredited
    Data Recipient and a valid authorized access token over the data holder's
    mutual-TLS channel; it is not publicly callable. Conforms to the shared DSB
    Consumer Data Standards CDR Banking API v1.36.0 that every Australian ADI must
    implement.
