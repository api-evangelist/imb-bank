  description: Consumer-authorized Consumer Data Right (CDR) Direct Debits and
    Scheduled Payments API. Covers GET /banking/accounts/{accountId}/direct-debits,
    the bulk GET /banking/accounts/direct-debits, GET
    /banking/accounts/{accountId}/payments/scheduled, and the bulk GET
    /banking/payments/scheduled. Access requires an IMB member's CDR authorization
    granted to an Accredited Data Recipient over the mutual-TLS data holder channel
    and is not publicly callable. Conforms to the shared DSB Consumer Data Standards
    CDR Banking API v1.36.0.
