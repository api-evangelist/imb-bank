    Data API exposing IMB Bank's retail banking products (home loans, deposits, cards
    and more) under the Consumer Data Standards path /cds-au/v1/banking/products.
    Confirmed live returning HTTP 200 with a data.products array; supports endpoint
    versions x-v 4 and 5. Covers the GET /banking/products list and GET
    /banking/products/{productId} detail operations.
