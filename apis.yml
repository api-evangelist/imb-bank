  name: IMB Bank CDR Transactions API
  tags:
  - CDR
  - Open Banking
  - Banking Transactions
  - Consumer Data Standards
  - Account Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.imb.com.au/openbanking
  baseURL: https://openbank.openbanking.imb.com.au/cds-au/v1/banking/accounts
